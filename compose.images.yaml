services:
  app:
    image: hladkyivadym/chatting-server:v1.0.0
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__ChattingDatabase: "Server=sql,1433;Database=ChattingDb;User Id=sa;Password=${DB_PASSWORD:?Set DB_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
    ports:
      - "8080:8080"
    depends_on:
      sql:
        condition: service_healthy
        
  client:
    image: hladkyivadym/chatting-client:v1.0.0
    environment:
      API_PROXY_TARGET: http://app:8080
    ports:
      - "53160:53160"
    depends_on:
      - app

  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  sql_data: